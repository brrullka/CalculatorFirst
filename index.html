<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>

    <div class="calculator-main">
        <div id="pole-result" style="color: white;"></div>
    
        <div class="buttons">
            <div class = "button" style="color: white; background-color: grey;"><</div>
            <div class="button" style="color: white; background-color: grey;">C</div> 
            <div class = "button" style="color: white; background-color: grey;">%</div>
            <div class = "button" style="color: white; background-color: orange;">/</div>
   
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">7</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">8</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">9</div>
        <div class = "button" style="color: white; background-color: orange;">*</div>
         

        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">4</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">5</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">6</div>
       <div class = "button" style="color: white; background-color: orange;">-</div>

        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">1</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">2</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">3</div>
        <div class = "button" style="color: white; background-color: orange;">+</div>


        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">+/-</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">0</div>
        <div class = "button" style="color: white; background-color: rgb(75, 75, 74);">,</div>
        <div class = "button" style="color: white; background-color: orange;">=</div>
        

    </div>

</div>



    <script src="main.js"></script>
</body>
</html>
